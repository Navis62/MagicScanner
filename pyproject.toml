[project]
name = "magicscanner"
version = "0.1.0"
description = "Scan webcam de cartes Magic, stock et export vers TCG Powertools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
magicscanner = "magicscanner.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["magicscanner*"]

[tool.setuptools.package-data]
"magicscanner.web" = ["static/*", "static/js/*"]
"magicscanner.recognition" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: nécessite la base importée (data/magicscanner.db) et le réseau"]
